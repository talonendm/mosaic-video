<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video → Scene → Mosaic → Exporter</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.4/dist/ffmpeg.min.js"></script>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            padding: 10px;
        }

        canvas {
            display: block;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        .controls {
            margin-bottom: 10px;
        }

        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
    </style>
</head>

<body>

    <script>
        // Stable + AI scene-detection mosaic (p5.js)
        // - Uses an offscreen HTML canvas for all video->image work (no image(video, ...) calls).
        // - Client-side scene detection by frame-difference (grayscale low-res).
        // - Captures representative frames, composes mosaic, and downloads PNG.

        // --- UI & globals
        let fileInput, runDetectBtn, buildBtn, downloadBtn, statusP;
        let videoEl, videoRaw;
        let durationSec = 0;

        let capCanvas = document.createElement("canvas");
        let capCtx = capCanvas.getContext("2d");

        let samples = [];      // {time, grayFloat32}
        let detections = [];   // {start, end, repTime}
        let repFrames = [];    // p5.Image[] representative frames

        // Controls
        let sampleRateInput, sensitivityInput, minSceneLenInput;
        let tileWidthInput, paddingInput, colsInput, maxSamplesInput;

        function setup() {
            createCanvas(900, 160);
            noLoop();
            background(18);
            fill(230);
            textSize(13);

            createP("<b>Stable AI Scene Detection → Mosaic</b>");

            createSpan("Upload video: ");
            fileInput = createFileInput(handleFile);
            fileInput.attribute("accept", "video/*");

            createDiv().style("height", "8px");

            createSpan("Samples/sec: ");
            sampleRateInput = createInput("3", "number");
            sampleRateInput.style("width", "60px");

            createSpan("  Sensitivity (0.05-2): ");
            sensitivityInput = createInput("0.20", "number");
            sensitivityInput.style("width", "70px");

            createSpan("  Min scene (s): ");
            minSceneLenInput = createInput("1.0", "number");
            minSceneLenInput.style("width", "60px");

            createDiv().style("height", "8px");

            createSpan("Tile width px: ");
            tileWidthInput = createInput("200", "number");
            tileWidthInput.style("width", "70px");

            createSpan("  Padding px: ");
            paddingInput = createInput("4", "number");
            paddingInput.style("width", "50px");

            createSpan("  Columns (0=auto): ");
            colsInput = createInput("0", "number");
            colsInput.style("width", "60px");

            createDiv().style("height", "8px");

            createSpan("Max samples: ");
            maxSamplesInput = createInput("500", "number");
            maxSamplesInput.style("width", "70px");

            createDiv().style("height", "8px");

            runDetectBtn = createButton("Run Scene Detection");
            runDetectBtn.attribute("disabled", true);
            runDetectBtn.mousePressed(runDetection);

            buildBtn = createButton("Compose Mosaic");
            buildBtn.attribute("disabled", true);
            buildBtn.mousePressed(composeMosaic);

            downloadBtn = createButton("Download PNG");
            downloadBtn.attribute("disabled", true);
            downloadBtn.mousePressed(() => saveCanvas("scene_mosaic", "png"));

            statusP = createP("Load a video to begin.");
        }

        // --- File load
        function handleFile(file) {
            if (!file || file.type !== "video") {
                statusP.html("Please upload a video file.");
                return;
            }

            if (videoEl) videoEl.remove();

            const url = URL.createObjectURL(file.file);
            videoEl = createVideo([url]);
            videoEl.hide();
            videoRaw = videoEl.elt;
            videoRaw.muted = true;
            videoRaw.preload = "metadata";
            videoRaw.crossOrigin = "anonymous";

            videoRaw.onloadedmetadata = () => {
                durationSec = videoRaw.duration || 0;
                if (!(durationSec > 0)) {
                    statusP.html("Could not read video duration.");
                    runDetectBtn.attribute("disabled", true);
                    return;
                }

                // set offscreen capture canvas to video natural dims
                capCanvas.width = videoRaw.videoWidth || 640;
                capCanvas.height = videoRaw.videoHeight || 360;

                statusP.html(`Video loaded — ${nf(durationSec, 1, 2)} s, ${capCanvas.width}×${capCanvas.height}`);
                runDetectBtn.removeAttribute("disabled");

                // reset previous detection data
                samples = [];
                detections = [];
                repFrames = [];
                buildBtn.attribute("disabled", true);
                downloadBtn.attribute("disabled", true);
            };

            videoRaw.onerror = () => {
                statusP.html("Error loading video. Try another file.");
                runDetectBtn.attribute("disabled", true);
            };
        }

        // --- Utility: safe seek (promise) with fallback timeout
        function seekSafe(timeSec, timeoutMs = 300) {
            return new Promise(resolve => {
                let resolved = false;
                function finish() {
                    if (!resolved) {
                        resolved = true;
                        // small delay to give decoder a moment
                        setTimeout(resolve, 0);
                    }
                }

                try {
                    videoRaw.currentTime = Math.max(0, Math.min(timeSec, durationSec - 0.001));
                } catch (e) {
                    // some browsers may throw on setting currentTime; ignore and continue
                }

                // Onseeked will fire when seek completes
                videoRaw.onseeked = () => finish();
                // safety fallback
                setTimeout(finish, timeoutMs);
            });
        }

        // --- Run detection: sample low-res grayscale frames and detect cuts
        async function runDetection() {
            if (!videoRaw) return;
            runDetectBtn.attribute("disabled", true);
            buildBtn.attribute("disabled", true);
            downloadBtn.attribute("disabled", true);

            samples = [];
            detections = [];
            repFrames = [];

            // Read params
            const sampleRate = max(1, float(sampleRateInput.value()) || 3);
            const sensitivity = max(0.001, float(sensitivityInput.value()) || 0.2);
            const minSceneLen = max(0.1, float(minSceneLenInput.value()) || 1.0);
            const maxSamples = max(10, int(maxSamplesInput.value()) || 500);

            // low-res detection canvas dims
            const detW = 160;
            const detH = Math.round((detW / capCanvas.width) * capCanvas.height);
            const detCanvas = document.createElement("canvas");
            detCanvas.width = detW;
            detCanvas.height = detH;
            const detCtx = detCanvas.getContext("2d");

            // build time list
            const step = 1.0 / sampleRate;
            let times = [];
            for (let t = 0; t < durationSec; t += step) {
                times.push(Math.min(t, durationSec - 0.001));
                if (times.length >= maxSamples) break;
            }
            // ensure last frame included
            if (times.length === 0 || times[times.length - 1] < durationSec - 0.01) {
                times.push(Math.max(0, durationSec - 0.001));
            }

            statusP.html(`Sampling ${times.length} frames at ${sampleRate} Hz...`);
            // prime video seeking
            try { await videoRaw.play(); videoRaw.pause(); } catch (e) { }

            // sequentially capture low-res grayscale arrays
            for (let i = 0; i < times.length; i++) {
                const t = times[i];
                await seekSafe(t, 300);
                // draw into offscreen capture canvas (full res)
                capCtx.drawImage(videoRaw, 0, 0, capCanvas.width, capCanvas.height);
                // draw the capCanvas into detCanvas (resized)
                detCtx.drawImage(capCanvas, 0, 0, detW, detH);
                // read pixels
                const imgData = detCtx.getImageData(0, 0, detW, detH).data;
                // produce Float32 grayscale
                const gray = new Float32Array(detW * detH);
                for (let p = 0, q = 0; p < imgData.length; p += 4, q++) {
                    // use luminance by channels
                    gray[q] = 0.299 * imgData[p] + 0.587 * imgData[p + 1] + 0.114 * imgData[p + 2];
                }
                samples.push({ time: t, gray });
                statusP.html(`Sampled ${i + 1}/${times.length} (t=${nf(t, 1, 2)}s)`);
                // small breathing pause
                await new Promise(r => setTimeout(r, 20));
            }

            // ---- analyze differences ----
            if (samples.length < 2) {
                statusP.html("Not enough samples to analyze. Try increasing sample rate or duration.");
                runDetectBtn.removeAttribute("disabled");
                return;
            }

            // compute mean absolute difference between consecutive frames
            const diffs = new Float32Array(samples.length - 1);
            const npix = detW * detH;
            let mx = 0, sumAll = 0;
            for (let i = 0; i < samples.length - 1; i++) {
                const a = samples[i].gray, b = samples[i + 1].gray;
                let s = 0;
                for (let p = 0; p < npix; p++) s += Math.abs(b[p] - a[p]);
                const meanDiff = s / npix; // 0..255
                diffs[i] = meanDiff;
                sumAll += meanDiff;
                if (meanDiff > mx) mx = meanDiff;
            }
            const meanAll = sumAll / diffs.length;
            // normalization baseline: a mix of mean and max to adapt across videos
            const normBase = Math.max(meanAll * 2.0, mx, 1.0);
            const norm = new Float32Array(diffs.length);
            for (let i = 0; i < diffs.length; i++) norm[i] = diffs[i] / normBase; // roughly 0..1+

            // detect boundaries: peaks above sensitivity with cooldown
            const cooldownSamples = Math.max(1, Math.ceil(minSceneLen / step));
            let boundaries = [samples[0].time];
            let lastIdx = -1000;
            for (let i = 0; i < norm.length; i++) {
                if (norm[i] >= sensitivity && (i - lastIdx) >= cooldownSamples) {
                    // boundary at samples[i+1].time
                    boundaries.push(samples[i + 1].time);
                    lastIdx = i;
                }
            }
            boundaries.push(Math.max(0, durationSec - 0.001));

            // build scene ranges
            detections = [];
            for (let i = 0; i < boundaries.length - 1; i++) {
                const s = boundaries[i];
                const e = boundaries[i + 1];
                if (e - s < 0.02) continue;
                const rep = Math.min(durationSec - 0.005, Math.max(0, (s + e) / 2.0));
                detections.push({ start: s, end: e, repTime: rep });
            }

            statusP.html(`Detected ${detections.length} scenes. Capturing representative frames...`);
            // capture representatives (full-res) safely into p5.Image objects
            repFrames = [];
            const fullW = capCanvas.width, fullH = capCanvas.height;

            for (let i = 0; i < detections.length; i++) {
                const d = detections[i];
                const t = Math.min(d.repTime, durationSec - 0.01);
                await seekSafe(t, 300);
                // draw video into offscreen capture canvas
                capCtx.drawImage(videoRaw, 0, 0, fullW, fullH);

                // create p5.Image and copy pixels via drawingContext to avoid p5's image(video, ...) issues
                let pimg = createImage(fullW, fullH);
                // Use the underlying canvas to copy into the p5.Image's drawingContext
                // (This is safe because pimg.drawingContext is a CanvasRenderingContext2D)
                pimg.drawingContext.drawImage(capCanvas, 0, 0);

                // Validate and push
                if (pimg instanceof p5.Image && pimg.width > 0 && pimg.height > 0) {
                    repFrames.push(pimg);
                }
                statusP.html(`Captured ${repFrames.length}/${detections.length} representative frames`);
                await new Promise(r => setTimeout(r, 30));
            }

            // If no frames captured, signal the user
            if (repFrames.length === 0) {
                statusP.html("No representative frames captured — try lowering sensitivity or reducing sample rate.");
                runDetectBtn.removeAttribute("disabled");
                return;
            }

            statusP.html(`Done: ${repFrames.length} frames. Click "Compose Mosaic".`);
            buildBtn.removeAttribute("disabled");
            runDetectBtn.removeAttribute("disabled");
        }

        // --- Cover-draw helper (safe)
        function drawCover(img, x, y, w, h) {
            if (!(img instanceof p5.Image)) return;
            if (img.width === 0 || img.height === 0) return;

            const ia = img.width / img.height;
            const ta = w / h;

            if (ia > ta) {
                const srcW = img.height * ta;
                const sx = (img.width - srcW) / 2;
                image(img, x, y, w, h, sx, 0, srcW, img.height);
            } else {
                const srcH = img.width / ta;
                const sy = (img.height - srcH) / 2;
                image(img, x, y, w, h, 0, sy, img.width, srcH);
            }
        }

        // --- Compose mosaic of repFrames
        function composeMosaic() {
            repFrames = repFrames.filter(img => img instanceof p5.Image && img.width > 0);
            if (!repFrames || repFrames.length === 0) {
                statusP.html("No frames to compose. Run detection first.");
                return;
            }

            let tileW = max(8, int(tileWidthInput.value()) || 200);
            let pad = max(0, int(paddingInput.value()) || 4);
            let cols = int(colsInput.value()) || 0;
            if (cols <= 0) cols = ceil(sqrt(repFrames.length));
            let rows = ceil(repFrames.length / cols);

            // tile height from aspect of first frame
            let aspect = repFrames[0].width / repFrames[0].height;
            let tileH = Math.round(tileW / aspect);

            // auto-scale if too big
            const MAX_DIM = 3000;
            let finalW = cols * tileW + Math.max(0, cols - 1) * pad;
            let finalH = rows * tileH + Math.max(0, rows - 1) * pad;
            if (finalW > MAX_DIM || finalH > MAX_DIM) {
                let s = min(MAX_DIM / finalW, MAX_DIM / finalH);
                tileW = Math.max(8, Math.floor(tileW * s));
                tileH = Math.max(8, Math.floor(tileH * s));
                finalW = cols * tileW + Math.max(0, cols - 1) * pad;
                finalH = rows * tileH + Math.max(0, rows - 1) * pad;
            }

            resizeCanvas(finalW, finalH);
            clear();
            background(12);

            let idx = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (idx >= repFrames.length) break;
                    const x = c * (tileW + pad);
                    const y = r * (tileH + pad);
                    drawCover(repFrames[idx], x, y, tileW, tileH);
                    idx++;
                }
            }

            statusP.html(`Mosaic composed: ${repFrames.length} tiles (${cols}×${rows}).`);
            downloadBtn.removeAttribute("disabled");
        }


    </script>
</body>

</html>
